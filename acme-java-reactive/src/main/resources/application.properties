spring.application.name=acme-bank-reactive

# R2DBC configuration (auto-configured by docker-compose)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/acmedb
spring.r2dbc.username=pguser
spring.r2dbc.password=pgpass

# Flyway (uses JDBC for migrations)
spring.flyway.url=jdbc:postgresql://localhost:5432/acmedb
spring.flyway.user=pguser
spring.flyway.password=pgpass
spring.flyway.cleanDisabled=false
spring.flyway.clean-on-migrate=true

# Logging
logging.level.root=ERROR
