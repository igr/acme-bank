spring.application.name=acme-bank-nonblocking

# Flyway configuration (uses JDBC)
spring.flyway.cleanDisabled=false
spring.flyway.clean-on-migrate=true

# R2DBC will be auto-configured by Spring Boot Docker Compose integration
# JDBC URL for Flyway is also auto-configured

# Logging for debugging
logging.level.org.springframework.r2dbc=DEBUG
